[platformio]
default_envs = kode_dot

[env:kode_dot]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = kode_dot
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_compat_mode = off
lib_ldf_mode = chain

monitor_filters = time, esp32_exception_decoder

build_flags =
    -I src
    -Wl,--wrap=esp_ota_mark_app_valid_cancel_rollback
    -DLV_CONF_INCLUDE_SIMPLE
    -Wno-deprecated-declarations
    -Wno-cpp
;    -D CONFIG_TINYUSB_ENABLED=0
;    -D ARDUINO_USB_MODE=0
;    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D USE_USB_KEYBOARD_ACTIONS

app_name = Deepseek

extra_scripts =
    pre:extra_scripts/auto_port.py
    pre:extra_scripts/rename_bin.py
    pre:extra_scripts/patch_neopixel.py

upload_port = COM57
monitor_port = COM57

lib_deps =
  adafruit/Adafruit BusIO @ ^1.15.0
  adafruit/Adafruit Unified Sensor @ ^1.1.4
  moononournation/GFX Library for Arduino @ ^1.6.0
  lvgl/lvgl @ ^9.0.0
  adafruit/Adafruit NeoPixel
  Makuna/NeoPixelBus @ ^2.7.7
  https://github.com/RobTillaart/TCA9555.git#0.4.3
  https://github.com/bitbank2/bb_captouch.git
  adafruit/Adafruit LIS2MDL
  adafruit/Adafruit LSM6DS
  https://github.com/kodediy/kode_MAX31329.git
  https://github.com/sqmsmu/PMIC_BQ25896.git
  https://github.com/kodediy/kode_BQ27220.git
  madhephaestus/ESP32Servo @ ^3.0.5
  bblanchon/ArduinoJson @ ^7.0.0
  densaugeo/base64 @ ^1.4.0